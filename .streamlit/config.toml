# ADI 視覺語言（與 adi-portal/docs/design/tokens.css 同源）
# primaryColor    = adi-deepblue（行動深藍）
# backgroundColor = adi-bg（透氣淺底）
# textColor       = adi-text
[theme]
primaryColor = "#1F4F7A"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#334155"
font = "sans serif"
baseRadius = "12px"
borderColor = "#E2E8F0"

# 精簡工具列：隱藏 Deploy / 主選單等 Streamlit 品牌殘留
[client]
toolbarMode = "minimal"
showErrorDetails = false
showSidebarNavigation = false
